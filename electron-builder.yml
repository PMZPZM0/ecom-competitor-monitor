appId: com.ecommerce.competitor-monitor
productName: 电商竞品监控
artifactName: EcomMonitor-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - '!electron/**/*.test.mjs'
  # Use an allow-list so electron-builder never walks local runtime data.
  # `server/data` can contain browser profiles, evidence, and generated files.
  - server/*.js
  - server/services/**/*
  - server/scripts/**/*
  - server/storage/**/*
  - server/utils/**/*
  - server/routes/**/*
  - server/qwenpaw-plugins/**/*
  - public/app-icon.ico
  - public/app-icon.png
  - package.json
  - '!server/**/*.test.js'
  - '!release/**'
  - '!output/**'
  - '!canvas/**'
asarUnpack:
  # QwenPaw loads this Python plugin from its own local runtime. It cannot
  # import or copy a plugin directory from Electron's app.asar archive.
  - server/qwenpaw-plugins/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@larksuite/cli/**/*
win:
  target:
    - nsis
  icon: public/app-icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 电商竞品监控
  uninstallDisplayName: 电商竞品监控
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  icon: public/app-icon.png
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
